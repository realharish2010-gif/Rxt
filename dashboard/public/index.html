<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RXT Marketing Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="signin" class="signin" hidden>
    <div class="signin-card">
      <img src="/favicon.svg" alt="" width="48" height="48">
      <h1>RXT Marketing</h1>
      <p class="muted">Sign in with your work account to see posts, analytics and make new posts.</p>
      <div id="google-btn"></div>
      <a id="github-btn" class="btn btn-ghost" href="/api/auth/github" hidden>Sign in with GitHub</a>
      <button id="dev-btn" class="btn btn-ghost" hidden>Local test sign-in</button>
      <p id="signin-error" class="error" role="alert" hidden></p>
      <p id="signin-setup" class="muted small" hidden>Google sign-in is not set up yet. See the setup guide in dashboard/README.md.</p>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <nav class="sidebar" aria-label="Main">
      <div class="brand"><img src="/favicon.svg" alt="" width="28" height="28"><span>RXT Marketing</span></div>
      <a href="#/" data-page="overview">Overview</a>
      <a href="#/new" data-page="new">New post</a>
      <a href="#/posts" data-page="posts">Posts</a>
      <a href="#/analytics" data-page="analytics">Analytics</a>
      <a href="#/runs" data-page="runs">Runs</a>
      <a href="#/reports" data-page="reports">Reports</a>
      <a href="#/audit" data-page="audit">Activity log</a>
      <div class="me" id="me"></div>
    </nav>
    <main id="page" tabindex="-1"></main>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" aria-label="Close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/markdown.js"></script>
  <script src="/app.js"></script>
</body>
</html>
