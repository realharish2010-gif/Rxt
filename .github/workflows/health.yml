name: Daily health check
run-name: ${{ inputs.timer && 'Daily health check (timer)' || 'Daily health check' }}
# Once a day, after the evening slot's window closes (22:57 India time): is the dashboard's
# GitHub token about to expire (warned 14 days ahead)? Did any of
# today's slots pass without a post? Problems open a GitHub issue labelled bot-alert, which
# GitHub emails to you (see alerts.py). Read-only: it never posts or commits anything.
on:
  schedule:
    - cron: "27 17 * * *"
  workflow_dispatch:
    inputs:
      timer:
        description: "Leave unticked. Set by the Cloudflare timer (timer/)"
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Check the dashboard token and today's posts
        run: python alerts.py health
        env:
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          DASHBOARD_TOKEN_EXPIRES: ${{ vars.DASHBOARD_TOKEN_EXPIRES }}  # saved by the dashboard
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY: ${{ github.repository_owner }}
      - name: Email an alert if this check itself failed
        if: failure() || cancelled()
        run: python alerts.py failed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY: ${{ github.repository_owner }}
