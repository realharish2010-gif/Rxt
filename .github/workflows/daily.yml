name: Daily carousel
on:
  schedule:
    - cron: "30 3 * * *"   # UTC time, change to when you want it to run
    - cron: "30 5 * * *"   # backup run if the first one failed
    - cron: "30 7 * * *"   # second backup run
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if a carousel already went out today"
        type: boolean
        default: false
concurrency:
  group: carousel
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}  # branch tip, so a run queued behind another sees its commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Learn from posts that are 3+ days old
        continue-on-error: true  # never block the daily post if Instagram insights fail
        run: python main.py learn
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Generate
        run: python main.py generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit slides
        run: |
          git config user.name "carousel-bot"
          git config user.email "carousel-bot@users.noreply.github.com"
          git add -A
          git commit -m "New carousel $(date -u +%F)" || true
          git push
      - name: Publish (only when AUTO_PUBLISH is true)
        if: vars.AUTO_PUBLISH == 'true'
        run: python main.py publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FORCE_PUBLISH: ${{ inputs.force }}
      - name: Save posted state
        if: vars.AUTO_PUBLISH == 'true'
        run: |
          git add -A
          git commit -m "Mark posted" || true
          git push
