name: Publish latest post (manual approval)
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if this slot (or today's limit) is already used"
        type: boolean
        default: false
concurrency:
  group: carousel
  cancel-in-progress: false
permissions:
  contents: write
  actions: read  # to fetch a Reel's video from the run that made it
  issues: write  # failure alerts (alerts.py)
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}  # branch tip, so a run queued behind another sees its commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Is the latest post a Reel?
        id: latest
        run: |
          python -c "import json; p = json.load(open('posts/latest.json')); print('run_id=' + (p.get('run_id') or '') if p.get('format') == 'reel' else 'run_id=')" >> "$GITHUB_OUTPUT"
      - name: Fetch the Reel video
        if: steps.latest.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: reel-${{ steps.latest.outputs.run_id }}
          path: posts
          run-id: ${{ steps.latest.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        run: python main.py publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FORCE_PUBLISH: ${{ inputs.force }}
      - name: Save posted state
        run: |
          git config user.name "carousel-bot"
          git config user.email "carousel-bot@users.noreply.github.com"
          git add -A
          git commit -m "Mark posted" || true
          # must land, or the next calendar run would post this slot again
          for i in 1 2 3 4; do git push -q && exit 0; echo "Push refused (main moved on), rebasing and retrying"; git pull --rebase -q || { git rebase --abort; exit 1; }; sleep 5; done
          exit 1
      - name: Email an alert if this run failed (opens a GitHub issue, see alerts.py)
        if: failure() || cancelled()
        run: python alerts.py failed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY: ${{ github.repository_owner }}
      - name: Close the alert once a run works again
        if: success()
        continue-on-error: true  # never fail a run that worked
        run: python alerts.py recovered
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
