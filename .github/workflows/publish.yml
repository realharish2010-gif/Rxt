name: Publish latest carousel (manual approval)
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if this slot (or today's limit) is already used"
        type: boolean
        default: false
concurrency:
  group: carousel
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}  # branch tip, so a run queued behind another sees its commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publish
        run: python main.py publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FORCE_PUBLISH: ${{ inputs.force }}
      - name: Save posted state
        run: |
          git config user.name "carousel-bot"
          git config user.email "carousel-bot@users.noreply.github.com"
          git add -A
          git commit -m "Mark posted" || true
          git push
