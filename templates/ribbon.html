<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- "Ribbon": dark gallery poster. A glossy twisted 3D ribbon in brand stripes drawn on
     a canvas (different shape every slide), with small editorial labels and the copy below. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--bg:{{BG}};--accent:{{ACCENT}};--text:{{TEXT}};--muted:{{MUTED}};
  --night:color-mix(in srgb,var(--text) 22%,#040706);--head:var(--bg)}
.cta{--head:var(--accent)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px}
body{position:relative;overflow:hidden;background:var(--night);color:var(--bg);font-family:'Archivo',sans-serif}
.abs{position:absolute}
canvas{position:absolute;left:0;top:0}
.glow{inset:0;background:radial-gradient(ellipse 60% 40% at 55% 32%,color-mix(in srgb,var(--text) 35%,transparent),transparent 70%)}
.logo-text{left:80px;top:74px;font-weight:800;font-size:30px;color:var(--bg)}
.logo{left:80px;top:64px;height:72px;width:auto;background:var(--bg);padding:8px 14px;border-radius:10px}
.no{left:80px;top:118px;font-weight:800;font-size:30px;color:var(--bg)}
.tr{right:80px;top:74px;text-align:right;font-weight:800;font-size:30px;line-height:1.1;color:var(--bg)}
.tr small{display:block;font-weight:600;font-size:21px;opacity:.75}
.foot{right:110px;bottom:66px;font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);opacity:.6}
.vl,.vr{font-weight:700;font-size:20px;letter-spacing:.04em;color:var(--bg);opacity:.8;white-space:nowrap}
.vl{left:58px;top:520px;transform-origin:left top;transform:rotate(-90deg) translateX(-100%)}
.vr{right:58px;top:420px;transform-origin:right top;transform:rotate(90deg) translateX(100%)}
.txt{position:absolute;left:110px;right:110px;bottom:130px}
h1{font-weight:800;font-size:86px;line-height:1;letter-spacing:-.02em;text-wrap:balance;color:var(--head)}
.copy{margin-top:30px;font-size:34px;line-height:1.42;font-weight:500;color:color-mix(in srgb,var(--bg) 86%,transparent);max-width:820px}
.hook .copy{font-size:37px}
.handle{left:110px;bottom:64px;font-weight:700;font-size:27px;color:var(--accent)}
.rule{left:110px;right:110px;bottom:108px;height:2px;background:color-mix(in srgb,var(--bg) 22%,transparent)}
</style>
</head>
<body class="{{KIND}}">
  <div class="abs glow"></div>
  <canvas id="c" width="2160" height="2700" style="width:1080px;height:1350px"></canvas>
  {{LOGO}}
  <div class="abs tr">{{NUM2}} / {{TOTAL2}}<small>financial health</small></div>
  <div class="abs foot">educational only</div>
  <div class="txt"><h1>{{TITLE}}</h1><div class="copy">{{BODY}}</div></div>
  <div class="abs rule"></div>
  <div class="abs handle">{{HANDLE}}</div>
<script>
/* shrink the headline so the text block leaves room for the ribbon */
function fit(){var h=document.querySelector('h1'),t=document.querySelector('.txt'),s=parseFloat(getComputedStyle(h).fontSize);
  while(t.getBoundingClientRect().top<640&&s>50){s-=3;h.style.fontSize=s+'px';}}
fit();
function hex(v){v=v.trim();if(v[0]=='#'){if(v.length==4)v='#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3];return [1,3,5].map(function(i){return parseInt(v.substr(i,2),16)});}
  var m=v.match(/[\d.]+/g);return m?m.slice(0,3).map(Number):[128,128,128];}
function mix(a,b,t){return [0,1,2].map(function(i){return a[i]+(b[i]-a[i])*t});}
function draw(){
  var cs=getComputedStyle(document.documentElement),G=hex(cs.getPropertyValue('--text')),Y=hex(cs.getPropertyValue('--accent')),W=[255,255,255],K=[6,14,10];
  var c=document.getElementById('c'),x=c.getContext('2d');x.setTransform(2,0,0,2,0,0);x.clearRect(0,0,1080,1350);
  var n=+'{{NUM}}',seed=n*48271+7;function r(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
  var bottom=document.querySelector('.txt').getBoundingClientRect().top-50,top=180;
  /* control points for a looping ribbon path through the free area */
  var P=[],k=6;
  for(var i=0;i<k;i++){var tt=i/(k-1);
    P.push([200+tt*560+(r()-.5)*160+(i%2?120:-40), top+(bottom-top)*(.15+.7*(i%2?r()*.5:.5+r()*.5))]);}
  if(n%2)P.reverse();
  function cr(p0,p1,p2,p3,t){var t2=t*t,t3=t2*t;return [0,1].map(function(j){return .5*((2*p1[j])+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3);});}
  var pts=[],E=[P[0]].concat(P,[P[P.length-1]]);
  for(var s=0;s<E.length-3;s++)for(var t=0;t<1;t+=1/60)pts.push(cr(E[s],E[s+1],E[s+2],E[s+3],t));
  var N=pts.length,S=26,twist=2.2+r()*1.4,ph=r()*6.28;
  var stripes=[mix(G,K,.45),G,mix(G,W,.35),W,G,mix(G,Y,.5),Y,mix(G,W,.6),G,mix(G,K,.3),W,mix(Y,W,.3),G];
  /* soft drop shadow under the ribbon */
  x.save();x.filter='blur(28px)';x.strokeStyle='rgba(0,0,0,.6)';x.lineWidth=110;x.lineCap='round';x.lineJoin='round';
  x.beginPath();pts.forEach(function(p,i){i?x.lineTo(p[0],p[1]+34):x.moveTo(p[0],p[1]+34);});x.stroke();x.restore();
  for(var i=0;i<N-1;i++){
    var a=pts[i],b=pts[i+1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
    var tt=i/(N-1),wid=(8+96*Math.sin(Math.PI*tt)),ca=Math.cos(ph+tt*twist*6.283),cb=Math.cos(ph+(i+1)/(N-1)*twist*6.283);
    var j=i+1<N-1?i+1:i,b2=pts[Math.min(j+1,N-1)],dx2=b2[0]-b[0],dy2=b2[1]-b[1],L2=Math.hypot(dx2,dy2)||1,nx2=-dy2/L2,ny2=dx2/L2;
    var light=.25+.75*Math.abs(ca),back=ca<0;
    for(var q=0;q<S;q++){
      var u0=-1+2*q/S,u1=-1+2*(q+1)/S,col=stripes[q%stripes.length];
      var spec=Math.max(0,1-Math.abs((u0+u1)/2-(back?-.35:.35))*3)*Math.abs(ca);
      var cc=mix(mix(K,col,back?light*.7:light),W,spec*.55);
      x.fillStyle='rgb('+cc.map(Math.round).join(',')+')';
      x.beginPath();
      x.moveTo(a[0]+nx*wid*ca*u0,a[1]+ny*wid*ca*u0);x.lineTo(a[0]+nx*wid*ca*u1,a[1]+ny*wid*ca*u1);
      x.lineTo(b[0]+nx2*wid*cb*u1,b[1]+ny2*wid*cb*u1);x.lineTo(b[0]+nx2*wid*cb*u0,b[1]+ny2*wid*cb*u0);
      x.closePath();x.fill();x.strokeStyle=x.fillStyle;x.lineWidth=.8;x.stroke();
    }
  }
}
draw();
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){fit();draw();});}
</script>
</body>
</html>
